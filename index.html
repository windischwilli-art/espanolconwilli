<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>El Camino del Español · 1000 Vokabeln</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..800&family=Work+Sans:wght@400;500;600;700&display=swap');

  :root {
    --ink: #2B2118;
    --panel: #FFFFFF;
    --panel-light: #F3EBDC;
    --cream: #2B2118;
    --cream-dim: #8C7A64;
    --coral: #FF6B54;
    --coral-dark: #E5573F;
    --gold: #F2A705;
    --gold-dark: #C98600;
    --mint: #2FBA88;
    --mint-dark: #24996E;
    --plum: #A873E0;
    --plum-dark: #8952C2;
    --red: #F04949;
    --line: rgba(43,33,24,0.10);
    --bg: #FFF6EA;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: linear-gradient(160deg, #FFE9D2 0%, #FFF6EA 45%, #FFEFE0 100%);
    font-family: 'Work Sans', sans-serif;
    color: var(--cream);
    display: flex;
    justify-content: center;
    padding: 24px 12px;
    min-height: 100vh;
  }

  .font-display { font-family: 'Fraunces', serif; }

  #app {
    width: 100%;
    max-width: 480px;
    min-height: 680px;
    background: var(--bg);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(178,110,60,0.22), 0 4px 14px rgba(178,110,60,0.12);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .screen { display: none; flex-direction: column; flex: 1; }
  .screen.active { display: flex; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: var(--cream-dim);
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    padding: 0;
  }
  .stats { display: flex; align-items: center; gap: 16px; }
  .stat { display: flex; align-items: center; gap: 5px; font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
  .hearts { display: flex; gap: 3px; }

  .progress-wrap { padding: 12px 20px 0; }
  .progress-track { height: 8px; border-radius: 999px; background: var(--panel-light); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; background: var(--coral); transition: width 0.3s ease; }
  .progress-fill.mint { background: var(--mint); }

  .hero-banner { width: 100%; height: 150px; overflow: hidden; position: relative; }
  .hero-banner svg { width: 100%; height: 100%; display: block; }

  .levels-header { padding: 22px 24px 4px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--coral); margin: 0 0 6px; font-weight: 600; }
  .big-title { font-size: 26px; font-weight: 700; margin: 0; }
  .sub-text { font-size: 14px; color: var(--cream-dim); margin: 8px 0 0; }

  .level-list { display: flex; flex-direction: column; gap: 14px; padding: 22px 22px 28px; overflow-y: auto; }
  .level-card {
    display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 20px;
    border: 1.5px solid var(--line); background: var(--panel); cursor: pointer; text-align: left; width: 100%;
    box-shadow: 0 3px 10px rgba(178,110,60,0.08);
    transition: transform 0.15s ease, box-shadow 0.15s ease; animation: popIn 0.3s cubic-bezier(.2,.9,.3,1.2);
  }
  .level-card:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(178,110,60,0.14); }
  .level-card:active:not(:disabled) { transform: scale(0.98); }
  .level-card:disabled { cursor: not-allowed; opacity: 0.55; }
  .level-icon {
    width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.14);
  }
  .level-info { flex: 1; min-width: 0; }
  .level-name { font-family: 'Fraunces', serif; font-weight: 700; font-size: 17px; margin: 0; }
  .level-tag { font-size: 11.5px; color: var(--cream-dim); margin: 2px 0 8px; }
  .level-track { height: 6px; border-radius: 999px; background: var(--panel-light); overflow: hidden; }
  .level-track-fill { height: 100%; border-radius: 999px; }
  .level-count { font-size: 11px; color: var(--cream-dim); margin: 6px 0 0; font-variant-numeric: tabular-nums; }
  .level-chevron { flex-shrink: 0; }

  .path-banner { width: 100%; height: 92px; overflow: hidden; }
  .path-banner svg { width: 100%; height: 100%; display: block; }

  .path-header { padding: 20px 24px 0; }
  .path-title { font-size: 22px; font-weight: 700; margin: 0; }
  .path-sub { font-size: 13.5px; color: var(--cream-dim); margin: 6px 0 0; }

  .path-scroll { flex: 1; overflow-y: auto; }
  .path-body {
    position: relative; max-width: 340px; margin: 32px auto 20px;
    display: flex; flex-direction: column; align-items: center; gap: 52px; padding-bottom: 24px;
  }
  .path-line {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; transform: translateX(-50%);
    background-image: linear-gradient(var(--line) 40%, transparent 0%);
    background-position: center; background-size: 3px 16px; background-repeat: repeat-y; z-index: 0;
  }

  .chapter-node { position: relative; display: flex; flex-direction: column; align-items: center; z-index: 1; animation: popIn 0.3s cubic-bezier(.2,.9,.3,1.2); }
  .node-btn {
    width: 72px; height: 72px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; background: var(--panel-light); transition: transform 0.15s ease;
  }
  .node-btn:hover:not(:disabled) { transform: scale(1.06); }
  .node-btn:active:not(:disabled) { transform: scale(0.95); }
  .node-btn.unlocked { background: var(--coral); box-shadow: 0 6px 0 0 var(--coral-dark); }
  .node-btn.done { background: var(--mint); box-shadow: 0 6px 0 0 var(--mint-dark); }
  .node-btn:disabled { cursor: not-allowed; }
  .node-btn svg { width: 28px; height: 28px; }

  .node-stars {
    position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 2px; background: var(--ink); padding: 2px 6px; border-radius: 999px;
  }
  .node-label { text-align: center; margin-top: 12px; }
  .node-label .name { font-family: 'Fraunces', serif; font-weight: 700; font-size: 15px; margin: 0; }
  .node-label .meta { font-size: 11.5px; color: var(--cream-dim); margin: 2px 0 0; }
  .node-label .name.locked { color: var(--cream-dim); }

  .card-area { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 32px; }
  .flashcard {
    width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 24px;
    padding: 36px 32px; text-align: center; animation: popIn 0.28s cubic-bezier(.2,.9,.3,1.2);
  }
  .flashcard .eyebrow { margin-bottom: 18px; }
  .card-word-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px; }
  .card-word { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 700; margin: 0; line-height: 1.2; }
  .card-de { font-size: 18px; color: var(--gold); margin: 0; }

  .cta-wrap { padding: 8px 24px 32px; }
  .btn-primary {
    width: 100%; max-width: 340px; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 16px; border: none; border-radius: 16px; background: var(--coral); color: var(--ink);
    font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 16px;
    box-shadow: 0 5px 0 0 var(--coral-dark); cursor: pointer; transition: transform 0.1s ease;
  }
  .btn-primary:active { transform: translateY(2px); box-shadow: 0 3px 0 0 var(--coral-dark); }
  .btn-primary.mint { background: var(--mint); box-shadow: 0 5px 0 0 var(--mint-dark); color: var(--ink); }
  .btn-primary.mint:active { box-shadow: 0 3px 0 0 var(--mint-dark); }
  .btn-secondary {
    width: 100%; max-width: 340px; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px; border: 1.5px solid var(--line); border-radius: 16px; background: transparent; color: var(--cream-dim);
    font-family: 'Work Sans', sans-serif; font-weight: 600; font-size: 15px; cursor: pointer;
  }

  .quiz-area { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px 24px 32px; }
  .quiz-prompt { text-align: center; font-size: 14px; color: var(--cream-dim); margin: 0 0 8px; }
  .quiz-word { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 700; text-align: center; margin: 0 0 26px; animation: popIn 0.28s cubic-bezier(.2,.9,.3,1.2); }
  .options { display: flex; flex-direction: column; gap: 12px; max-width: 340px; margin: 0 auto; width: 100%; }
  .option-btn {
    text-align: left; padding: 15px 20px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--panel);
    color: var(--cream); font-family: 'Work Sans', sans-serif; font-size: 14.5px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; transition: background 0.15s ease, border-color 0.15s ease;
  }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct { background: rgba(95,209,160,0.18); border-color: var(--mint); }
  .option-btn.wrong { background: rgba(255,92,92,0.18); border-color: var(--red); animation: shake 0.4s; }
  .option-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

  .result-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; }
  .result-icon {
    width: 92px; height: 92px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    margin-bottom: 22px; animation: popIn 0.3s cubic-bezier(.2,.9,.3,1.2);
  }
  .result-icon.win { background: rgba(242,183,5,0.15); }
  .result-icon.fail { background: rgba(255,92,92,0.15); }
  .result-title { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 700; margin: 0 0 8px; }
  .result-text { font-size: 14px; color: var(--cream-dim); margin: 0 0 22px; max-width: 300px; }
  .result-stars { display: flex; gap: 8px; margin-bottom: 28px; }
  .result-actions { width: 100%; max-width: 260px; display: flex; flex-direction: column; gap: 12px; }

  @keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes shake { 10%,90%{transform:translateX(-1px)} 20%,80%{transform:translateX(2px)} 30%,50%,70%{transform:translateX(-4px)} 40%,60%{transform:translateX(4px)} }
  @media (prefers-reduced-motion: reduce) {
    .chapter-node, .flashcard, .quiz-word, .result-icon, .level-card { animation: none; }
    .option-btn.wrong { animation: none; }
  }

  button:focus-visible, .node-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-light); border-radius: 999px; }
</style>
</head>
<body>

<div id="app">

  <!-- ================= LEVELS SCREEN ================= -->
  <section class="screen active" id="screen-levels">
    <div class="hero-banner">
      <svg viewBox="0 0 480 190" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="heroSky" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FF9B6A"/>
            <stop offset="45%" stop-color="#FF6B54"/>
            <stop offset="100%" stop-color="#A873E0"/>
          </linearGradient>
        </defs>
        <rect width="480" height="190" fill="url(#heroSky)"/>
        <circle cx="80" cy="55" r="34" fill="#FFE08A" opacity="0.95"/>
        <circle cx="80" cy="55" r="34" fill="none" stroke="#FFF6EA" stroke-width="2" opacity="0.5"/>
        <circle cx="410" cy="34" r="6" fill="#FFF6EA" opacity="0.6"/>
        <circle cx="378" cy="60" r="4" fill="#FFF6EA" opacity="0.5"/>
        <circle cx="440" cy="70" r="3.5" fill="#FFF6EA" opacity="0.5"/>
        <circle cx="34" cy="120" r="5" fill="#FFF6EA" opacity="0.4"/>
        <!-- Torbogen (Puerta de Alcalá-artig) -->
        <g fill="#FFF6EA" opacity="0.96">
          <path d="M150 190V96a40 40 0 0 1 80 0v94h-18V96a22 22 0 0 0-44 0v94Z"/>
          <path d="M258 190V96a40 40 0 0 1 80 0v94h-18V96a22 22 0 0 0-44 0v94Z"/>
        </g>
        <!-- Skyline-Silhouette -->
        <g fill="#3B2A1D" opacity="0.85">
          <rect x="0" y="150" width="480" height="40"/>
          <rect x="18" y="126" width="26" height="24"/>
          <rect x="56" y="112" width="20" height="38"/>
          <rect x="360" y="118" width="24" height="32"/>
          <rect x="396" y="100" width="18" height="50"/>
          <rect x="424" y="128" width="22" height="22"/>
          <polygon points="65,112 66,100 67,112"/>
        </g>
        <!-- Konfetti -->
        <g fill="#FFE08A">
          <circle cx="210" cy="40" r="4"/>
          <circle cx="300" cy="26" r="3"/>
          <circle cx="130" cy="30" r="3"/>
        </g>
        <g fill="#5FE0B0">
          <circle cx="240" cy="60" r="3.5"/>
          <circle cx="340" cy="44" r="3"/>
        </g>
      </svg>
    </div>
    <div class="levels-header">
      <p class="eyebrow">El Camino del Español</p>
      <h1 class="big-title font-display">Wähle dein Niveau</h1>
      <p class="sub-text">1000 Vokabeln in 20 Kapiteln — von den ersten Wörtern bis zum sicheren Alltagsspanisch.</p>
    </div>
    <div class="level-list" id="level-list"></div>
  </section>

  <!-- ================= PATH SCREEN ================= -->
  <section class="screen" id="screen-path">
    <div class="topbar">
      <button class="back-btn" onclick="goToLevels()">&larr; Niveaus</button>
      <div></div>
    </div>
    <div class="path-banner" id="path-banner"></div>
    <div class="path-header">
      <p class="eyebrow" id="path-eyebrow"></p>
      <h1 class="path-title font-display" id="path-title"></h1>
      <p class="path-sub" id="path-sub"></p>
    </div>
    <div class="path-scroll">
      <div class="path-body" id="path-body">
        <div class="path-line"></div>
      </div>
    </div>
  </section>

  <!-- ================= FLASHCARD SCREEN ================= -->
  <section class="screen" id="screen-cards">
    <div class="topbar">
      <button class="back-btn" onclick="goToPath(state.levelId)">&larr; Ruta</button>
      <div></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="card-progress"></div></div>
    </div>
    <div class="card-area">
      <div class="flashcard" id="flashcard">
        <p class="eyebrow" id="card-eyebrow"></p>
        <div class="card-word-row">
          <h2 class="card-word font-display" id="card-word"></h2>
          <svg viewBox="0 0 24 24" fill="none" stroke="#9C8B72" stroke-width="2" width="20" height="20"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </div>
        <p class="card-de" id="card-de"></p>
      </div>
    </div>
    <div class="cta-wrap">
      <button class="btn-primary" id="card-next-btn" onclick="nextCard()">
        <span id="card-next-label">Weiter</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="#2B2118" stroke-width="2.4" width="18" height="18"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>
    </div>
  </section>

  <!-- ================= QUIZ SCREEN ================= -->
  <section class="screen" id="screen-quiz">
    <div class="topbar">
      <button class="back-btn" onclick="goToPath(state.levelId)">&larr; Ruta</button>
      <div class="stats">
        <div class="stat" style="color: var(--gold)">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="#F2B705"><path d="M12 2l2.9 6.6L22 9.3l-5 4.8 1.3 7-6.3-3.6L5.7 21l1.3-7-5-4.8 7.1-0.7L12 2z"/></svg>
          <span id="quiz-xp">0 XP</span>
        </div>
        <div class="stat" style="color: var(--coral)">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="#FF6B54"><path d="M12 2c1 4-3 5-3 9a3 3 0 0 0 6 0c0-1-.5-2-1-2 2 1 3 3 3 5a5 5 0 0 1-10 0c0-5 5-6 5-12z"/></svg>
          <span id="quiz-streak">0</span>
        </div>
        <div class="hearts" id="quiz-hearts"></div>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill mint" id="quiz-progress"></div></div>
    </div>
    <div class="quiz-area">
      <p class="quiz-prompt">Was bedeutet dieses Wort?</p>
      <h2 class="quiz-word font-display" id="quiz-word"></h2>
      <div class="options" id="quiz-options"></div>
    </div>
  </section>

  <!-- ================= RESULT SCREEN ================= -->
  <section class="screen" id="screen-result">
    <div class="result-area">
      <div class="result-icon" id="result-icon"></div>
      <h2 class="result-title" id="result-title"></h2>
      <p class="result-text" id="result-text"></p>
      <div class="result-stars" id="result-stars"></div>
      <div class="result-actions" id="result-actions"></div>
    </div>
  </section>

</div>

<script>

      { es: "posible", de: "möglich" },
      { es: "imposible", de: "unmöglich" },
      { es: "seguro", de: "sicher" },
      { es: "peligroso", de: "gefährlich" },
      { es: "cómodo", de: "bequem" },
      { es: "cerca de", de: "in der Nähe von" },
      { es: "lejos de", de: "weit weg von" },
      { es: "sin embargo", de: "trotzdem" },
    ]
  }
];

const ALL_WORDS = CHAPTERS.flatMap(c => c.words);
const CH_BY_ID = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));

/* ---------------------------------------------------------
   Niveaustufen (4 Stufen x 5 Kapitel = 20 Kapitel)
--------------------------------------------------------- */
const LEVELS = [
  {
    id: "beginner", name: "Anfänger", tag: "A1 · Grundlagen", accent: "coral",
    icon: '<path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><circle cx="12" cy="12" r="3"/>',
    chapters: ["saludos-1","saludos-2","familia-1","familia-2","numeros-1","numeros-2","colores-1","colores-2","comida-1","comida-2"],
  },
  {
    id: "intermediate", name: "Fortgeschritten", tag: "A2–B1 · Alltag", accent: "gold",
    icon: '<circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.2 6.2-6.2 2.2 2.2-6.2z"/>',
    chapters: ["casa-1","casa-2","ropa-1","ropa-2","cuerpo-1","cuerpo-2","viaje-1","viaje-2","ciudad-1","ciudad-2"],
  },
  {
    id: "advanced", name: "Erfahren", tag: "B1–B2 · Vertiefung", accent: "mint",
    icon: '<path d="M2 6a2 2 0 0 1 2-2h6v16H4a2 2 0 0 1-2-2Z"/><path d="M22 6a2 2 0 0 0-2-2h-6v16h6a2 2 0 0 0 2-2Z"/>',
    chapters: ["tiempo-1","tiempo-2","animales-1","animales-2","naturaleza-1","naturaleza-2","trabajo-1","trabajo-2","escuela-1","escuela-2"],
  },
  {
    id: "master", name: "Profi", tag: "B2–C1 · Meisterschaft", accent: "plum",
    icon: '<path d="M2 18h20l-2-9-5 4-3-7-3 7-5-4Z"/>',
    chapters: ["sentimientos-1","sentimientos-2","tecnologia-1","tecnologia-2","deporte-1","deporte-2","verbos-1","verbos-2","adjetivos-1","adjetivos-2"],
  },
];
const LEVEL_BY_ID = Object.fromEntries(LEVELS.map(l => [l.id, l]));
const ACCENT_VARS = {
  coral: { main: "var(--coral)", dark: "var(--coral-dark)" },
  gold: { main: "var(--gold)", dark: "var(--gold-dark)" },
  mint: { main: "var(--mint)", dark: "var(--mint-dark)" },
  plum: { main: "var(--plum)", dark: "var(--plum-dark)" },
};

const LOCK_SVG = '<path d="M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2Z"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>';
const CHEVRON_SVG = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>';
const STAR_SVG = (filled) => `<svg viewBox="0 0 24 24" width="14" height="14" fill="${filled ? '#F2B705' : 'none'}" stroke="#F2B705" stroke-width="1.5"><path d="M12 2l2.9 6.6L22 9.3l-5 4.8 1.3 7-6.3-3.6L5.7 21l1.3-7-5-4.8 7.1-0.7L12 2z"/></svg>`;

/* ---------------------------------------------------------
   State
--------------------------------------------------------- */
let state = {
  levelId: null, chapterId: null, cardIndex: 0, quiz: [], qIndex: 0,
  hearts: 3, correctCount: 0, xp: 0, streak: 0,
  progress: Object.fromEntries(CHAPTERS.map(c => [c.id, { done: false, stars: 0 }])),
  lastGain: 0, lastFailed: false,
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuiz(chapter) {
  const pool = shuffle(chapter.words).slice(0, 6);
  return pool.map(word => {
    const distractors = shuffle(ALL_WORDS.filter(w => w.de !== word.de)).slice(0, 3);
    const options = shuffle([word.de, ...distractors.map(w => w.de)]);
    return { word, options };
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ---------------------------------------------------------
   Unlock-Logik
--------------------------------------------------------- */
// Freischalt-Logik deaktiviert: alle Niveaus und Kapitel sind von Anfang an zugänglich.
function isLevelUnlocked(levelIdx) {
  return true;
}
function isChapterUnlocked(level, chapterIdxInLevel, levelIdx) {
  return true;
}

/* ---------------------------------------------------------
   Levels screen
--------------------------------------------------------- */
function renderLevels() {
  const list = document.getElementById('level-list');
  list.innerHTML = '';
  LEVELS.forEach((level, idx) => {
    const unlocked = isLevelUnlocked(idx);
    const doneCount = level.chapters.filter(id => state.progress[id].done).length;
    const total = level.chapters.length;
    const accent = ACCENT_VARS[level.accent];

    const card = document.createElement('button');
    card.className = 'level-card';
    card.disabled = !unlocked;
    card.onclick = () => unlocked && goToPath(level.id);
    card.style.animationDelay = `${idx * 0.05}s`;

    const iconSvg = `<svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="#FFFFFF" stroke-width="2.1">${level.icon}</svg>`;

    const wordCount = level.chapters.reduce((sum, id) => sum + CH_BY_ID[id].words.length, 0);

    card.innerHTML = `
      <div class="level-icon" style="background:linear-gradient(135deg, ${accent.main}, ${accent.dark})">${iconSvg}</div>
      <div class="level-info">
        <p class="level-name">${level.name}</p>
        <p class="level-tag">${level.tag}${unlocked ? '' : ' · gesperrt'} · ${wordCount} Vokabeln</p>
        <div class="level-track">
          <div class="level-track-fill" style="width:${(doneCount/total)*100}%; background:${accent.main}"></div>
        </div>
        <p class="level-count">${doneCount}/${total} Kapitel abgeschlossen</p>
      </div>
      <div class="level-chevron" style="color:var(--cream-dim)">${CHEVRON_SVG}</div>
    `;
    list.appendChild(card);
  });
}
function goToLevels() { renderLevels(); showScreen('screen-levels'); }

/* ---------------------------------------------------------
   Path screen
--------------------------------------------------------- */
const OFFSETS = [0, 56, -20, 60, -8];

function renderPath() {
  const level = LEVEL_BY_ID[state.levelId];
  const levelIdx = LEVELS.findIndex(l => l.id === level.id);
  const accent = ACCENT_VARS[level.accent];

  document.getElementById('path-banner').innerHTML = `
    <svg viewBox="0 0 480 92" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="pathSky-${level.id}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="${accent.main}"/>
          <stop offset="100%" stop-color="${accent.dark}"/>
        </linearGradient>
      </defs>
      <rect width="480" height="92" fill="url(#pathSky-${level.id})"/>
      <circle cx="430" cy="24" r="18" fill="#FFF6EA" opacity="0.22"/>
      <circle cx="40" cy="18" r="5" fill="#FFF6EA" opacity="0.35"/>
      <circle cx="70" cy="30" r="3" fill="#FFF6EA" opacity="0.3"/>
      <g fill="#FFF6EA" opacity="0.9">
        <rect x="0" y="66" width="480" height="26"/>
        <rect x="24" y="48" width="22" height="20"/>
        <rect x="64" y="38" width="16" height="30"/>
        <rect x="120" y="52" width="24" height="16"/>
        <rect x="300" y="44" width="20" height="24"/>
        <rect x="340" y="30" width="16" height="38"/>
        <rect x="380" y="50" width="26" height="18"/>
        <rect x="430" y="40" width="18" height="28"/>
        <path d="M64 38h16v-9l-8-7-8 7Z"/>
      </g>
    </svg>
  `;

  document.getElementById('path-eyebrow').textContent = `${level.name} · ${level.tag}`;
  document.getElementById('path-title').textContent = 'Deine Route durchs Spanische';
  document.getElementById('path-sub').textContent = 'Jede Station ist eine Stadt, jedes Kapitel ein neuer Stempel im Reisepass.';

  const body = document.getElementById('path-body');
  body.querySelectorAll('.chapter-node').forEach(n => n.remove());

  level.chapters.forEach((chId, i) => {
    const ch = CH_BY_ID[chId];
    const st = state.progress[ch.id];
    const unlocked = isChapterUnlocked(level, i, levelIdx);

    const node = document.createElement('div');
    node.className = 'chapter-node';
    node.style.transform = `translateX(${OFFSETS[i % OFFSETS.length]}px)`;

    const btnClass = unlocked ? (st.done ? 'node-btn done' : 'node-btn unlocked') : 'node-btn';
    const iconSvg = unlocked
      ? `<svg viewBox="0 0 24 24" fill="none" stroke="#2B2118" stroke-width="2.2" width="28" height="28">${ch.icon}</svg>`
      : `<svg viewBox="0 0 24 24" fill="none" stroke="#9C8B72" stroke-width="2" width="24" height="24">${LOCK_SVG}</svg>`;

    const starsHtml = st.done
      ? `<div class="node-stars">${[0,1,2].map(s => STAR_SVG(s < st.stars)).join('')}</div>`
      : '';

    node.innerHTML = `
      <button class="${btnClass}" ${unlocked ? '' : 'disabled'} onclick="openChapter('${ch.id}')">
        ${iconSvg}
        ${starsHtml}
      </button>
      <div class="node-label">
        <p class="name font-display ${unlocked ? '' : 'locked'}">${ch.title}</p>
        <p class="meta">${ch.subtitle} · ${ch.stop}</p>
      </div>
    `;
    body.appendChild(node);
  });
}
function goToPath(levelId) { state.levelId = levelId; renderPath(); showScreen('screen-path'); }

/* ---------------------------------------------------------
   Flashcard screen
--------------------------------------------------------- */
function openChapter(chapterId) {
  state.chapterId = chapterId;
  state.cardIndex = 0;
  renderCard();
  showScreen('screen-cards');
}

function renderCard() {
  const chapter = CH_BY_ID[state.chapterId];
  const word = chapter.words[state.cardIndex];
  const total = chapter.words.length;

  document.getElementById('card-progress').style.width = `${((state.cardIndex + 1) / total) * 100}%`;
  document.getElementById('card-eyebrow').textContent = `${chapter.subtitle} · ${state.cardIndex + 1}/${total}`;
  document.getElementById('card-word').textContent = word.es;
  document.getElementById('card-de').textContent = word.de;
  document.getElementById('card-next-label').textContent = (state.cardIndex + 1 < total) ? 'Weiter' : 'Zum Quiz';

  const card = document.getElementById('flashcard');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';
}

function nextCard() {
  const chapter = CH_BY_ID[state.chapterId];
  if (state.cardIndex + 1 < chapter.words.length) {
    state.cardIndex++;
    renderCard();
  } else {
    state.quiz = buildQuiz(chapter);
    state.qIndex = 0;
    state.hearts = 3;
    state.correctCount = 0;
    renderQuiz();
    showScreen('screen-quiz');
  }
}

/* ---------------------------------------------------------
   Quiz screen
--------------------------------------------------------- */
function renderHearts() {
  const el = document.getElementById('quiz-hearts');
  el.innerHTML = [0,1,2].map(i => `
    <svg viewBox="0 0 24 24" width="17" height="17" fill="${i < state.hearts ? '#FF5C5C' : 'none'}" stroke="#FF5C5C" stroke-width="1.8">
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/>
    </svg>
  `).join('');
}

function renderQuiz() {
  const q = state.quiz[state.qIndex];
  document.getElementById('quiz-progress').style.width = `${(state.qIndex / state.quiz.length) * 100}%`;
  document.getElementById('quiz-xp').textContent = `${state.xp} XP`;
  document.getElementById('quiz-streak').textContent = state.streak;
  renderHearts();

  const wordEl = document.getElementById('quiz-word');
  wordEl.textContent = q.word.es;
  wordEl.style.animation = 'none';
  void wordEl.offsetWidth;
  wordEl.style.animation = '';

  const opts = document.getElementById('quiz-options');
  opts.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => answerQuiz(opt);
    opts.appendChild(btn);
  });
}

const CHECK_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#5FD1A0" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>';
const X_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#FF5C5C" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>';

function answerQuiz(opt) {
  const q = state.quiz[state.qIndex];
  const correct = opt === q.word.de;
  const buttons = document.querySelectorAll('#quiz-options .option-btn');

  buttons.forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === opt) {
      btn.classList.add(correct ? 'correct' : 'wrong');
      btn.innerHTML = `<span>${btn.textContent}</span>${correct ? CHECK_SVG : X_SVG}`;
    } else if (btn.textContent === q.word.de) {
      btn.classList.add('correct');
      btn.innerHTML = `<span>${btn.textContent}</span>${CHECK_SVG}`;
    }
  });

  if (correct) {
    state.correctCount++;
    state.xp += 10;
    state.streak++;
  } else {
    state.streak = 0;
    state.hearts--;
  }
  document.getElementById('quiz-xp').textContent = `${state.xp} XP`;
  document.getElementById('quiz-streak').textContent = state.streak;
  renderHearts();

  setTimeout(() => {
    if (state.hearts <= 0) {
      state.lastFailed = true;
      renderResult();
      showScreen('screen-result');
      return;
    }
    if (state.qIndex + 1 < state.quiz.length) {
      state.qIndex++;
      renderQuiz();
    } else {
      const ratio = state.correctCount / state.quiz.length;
      const stars = ratio === 1 ? 3 : ratio >= 0.66 ? 2 : 1;
      const bonus = 50;
      state.xp += bonus;
      state.lastGain = state.correctCount * 10 + bonus;
      state.lastFailed = false;
      state.progress[state.chapterId] = { done: true, stars };
      renderResult();
      showScreen('screen-result');
    }
  }, 900);
}

/* ---------------------------------------------------------
   Result screen
--------------------------------------------------------- */
function renderResult() {
  const chapter = CH_BY_ID[state.chapterId];
  const level = LEVEL_BY_ID[state.levelId];
  const levelIdx = LEVELS.findIndex(l => l.id === level.id);
  const ratio = state.correctCount / (state.quiz.length || 1);
  const stars = ratio === 1 ? 3 : ratio >= 0.66 ? 2 : 1;

  const icon = document.getElementById('result-icon');
  const title = document.getElementById('result-title');
  const text = document.getElementById('result-text');
  const starsEl = document.getElementById('result-stars');
  const actions = document.getElementById('result-actions');

  if (state.lastFailed) {
    icon.className = 'result-icon fail';
    icon.innerHTML = '<svg viewBox="0 0 24 24" width="40" height="40" fill="#FF5C5C" stroke="#FF5C5C"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>';
    title.textContent = 'Fast geschafft!';
    text.textContent = 'Die Herzen sind aufgebraucht. Versuch die Lektion noch einmal.';
    starsEl.innerHTML = '';
    actions.innerHTML = `
      <button class="btn-primary" onclick="retryChapter()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#2B2118" stroke-width="2.4"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.5 9A9 9 0 0 0 5 5.3L1 10m22 4-4 4.7A9 9 0 0 1 3.5 15"/></svg>
        Nochmal versuchen
      </button>`;
  } else {
    const levelJustCompleted = level.chapters.every(id => state.progress[id].done);
    const nextLevel = LEVELS[levelIdx + 1];
    const unlockedNextLevel = levelJustCompleted && nextLevel;

    icon.className = 'result-icon win';
    icon.innerHTML = '<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#F2B705" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M7 5H4a2 2 0 0 0 2 4M17 5h3a2 2 0 0 1-2 4"/></svg>';
    title.textContent = `${chapter.stop} erreicht!`;
    text.textContent = unlockedNextLevel
      ? `Du hast ${chapter.title} abgeschlossen (+${state.lastGain} XP) und das Niveau „${nextLevel.name}" freigeschaltet!`
      : `Du hast ${chapter.title} abgeschlossen und +${state.lastGain} XP gesammelt.`;
    starsEl.innerHTML = [0,1,2].map(s => `
      <svg viewBox="0 0 24 24" width="32" height="32" fill="${s < stars ? '#F2B705' : 'none'}" stroke="#F2B705" stroke-width="1.8">
        <path d="M12 2l2.9 6.6L22 9.3l-5 4.8 1.3 7-6.3-3.6L5.7 21l1.3-7-5-4.8 7.1-0.7L12 2z"/>
      </svg>`).join('');
    actions.innerHTML = `
      <button class="btn-primary mint" onclick="goToPath('${level.id}')">
        Weiter auf der Route
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#2B2118" stroke-width="2.4"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </button>
      ${unlockedNextLevel ? `<button class="btn-secondary" onclick="goToLevels()">Niveaus ansehen</button>` : ''}`;
  }
}

function retryChapter() {
  state.cardIndex = 0;
  renderCard();
  showScreen('screen-cards');
}

/* ---------------------------------------------------------
   Init
--------------------------------------------------------- */
renderLevels();
</script>
